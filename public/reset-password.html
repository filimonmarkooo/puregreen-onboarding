<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Green | Set New Password</title>
<link rel="stylesheet" href="/css/brand.css">
<link rel="icon" href="/img/logo-mark.svg">
<style>
  body { display:flex; flex-direction:column; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
  .box { background:#fff; padding:46px 42px; max-width:430px; width:100%; border-top:4px solid var(--pg-dark-green); }
  .box h2 { font-family:var(--font-display); font-weight:700; font-size:40px; line-height:.9; letter-spacing:.5px; text-transform:uppercase; color:var(--pg-dark-green); margin:14px 0 14px; }
  .box h2 .lt { color:var(--pg-light-green); }
  .box p { font-size:14.5px; color:var(--ink-3); line-height:1.75; margin-bottom:28px; }
  .back { display:inline-block; margin-top:20px; font-family:var(--font-mono); font-size:11px; letter-spacing:1.3px; text-transform:uppercase; color:var(--ink-3); text-decoration:none; }
  .back:hover { color:var(--pg-dark-green); }
</style>
</head>
<body>
<div class="box">
  <a class="pg-logo" href="/"><img src="/img/logo-mark.svg" alt="Pure Green"><span class="pg-logo-text">pure<span>green</span></span></a>
  <h2>Set New<br><span class="lt">Password</span></h2>
  <p>Choose a strong password for your account.</p>
<div class="alert alert-error" id="err"></div>
  <div class="alert alert-success" id="suc"></div>
  <div class="form-group">
    <label class="form-label">New Password</label>
    <input class="form-input" type="password" id="pw" placeholder="Min 8 characters" />
  </div>
  <div class="form-group">
    <label class="form-label">Confirm Password</label>
    <input class="form-input" type="password" id="pw2" placeholder="Repeat password" />
  </div>
  <button class="btn btn-primary btn-full" onclick="reset()" id="btn">Update Password</button>
</div>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) { document.querySelector('p').textContent = 'Invalid reset link.'; }

async function reset() {
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  hide('err'); hide('suc');
  if (pw.length < 8) return show('err','Password must be at least 8 characters.');
  if (pw !== pw2) return show('err','Passwords do not match.');
  const btn = document.getElementById('btn');
  btn.disabled=true; btn.textContent='Updating…';
  const res = await fetch('/api/auth/reset-password', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw})});
  const d = await res.json();
  if (d.success) { show('suc','Password updated! Redirecting to login…'); setTimeout(() => window.location.href='/', 2000); }
  else { show('err', d.error||'Reset failed. Link may have expired.'); btn.disabled=false; btn.textContent='Update Password'; }
}
function show(id, msg) { const e=document.getElementById(id); e.textContent=msg; e.classList.add('show'); }
function hide(id) { document.getElementById(id).classList.remove('show'); }
</script>
</body>
</html>
