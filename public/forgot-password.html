<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · Pure Green Franchise Onboarding</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="/fonts/AlternateGothicATF-Demi.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/fonts/GothamRnd-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="/css/brand.css">
<link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg">
<style>
  body { display:flex; flex-direction:column; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
  .box { background:#fff; border:1px solid var(--hairline); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:36px 36px 30px; max-width:440px; width:100%; }
  @media(max-width:520px){ .box { padding:28px 22px 24px; } }
  .box .pg-logo img { height:26px; }
  .box .eyebrow { margin-top:26px; }
  .box h2 { font-family:var(--font-display); font-weight:600; font-size:40px; line-height:.92; letter-spacing:.005em; text-transform:uppercase; color:var(--pg-green); margin:8px 0 12px; }
  .box h2 .lt { color:var(--pg-lime); }
  .box p { font-size:14.5px; color:var(--pg-muted); line-height:1.7; margin-bottom:24px; }
  .back { display:inline-flex; align-items:center; gap:8px; margin-top:20px; font-family:var(--font-mono); font-weight:700; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--pg-muted); text-decoration:none; }
  .back:hover { color:var(--pg-green); }
  .foot { margin-top:22px; font-family:var(--font-mono); font-weight:700; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--pg-faint); text-align:center; }
</style>
</head>
<body>
<div class="box">
  <a class="pg-logo" href="/"><img src="/img/pure-green-primary.png" alt="Pure Green" width="172" height="31"></a>
  <div class="eyebrow">Account recovery</div>
  <h2>Forgot<br><span class="lt">Password</span></h2>
  <p>Enter your email and we will send you a link to reset your password.</p>
<div class="alert alert-error" id="err"></div>
  <div class="alert alert-success" id="suc"></div>
  <div class="form-group">
    <label class="form-label">Email Address</label>
    <input class="form-input" type="email" id="email" placeholder="your@email.com" />
  </div>
  <button class="btn btn-primary btn-full" onclick="send()" id="btn">Send Reset Link</button>
  <a href="/" class="back">← Back to Sign In</a>
  <div class="foot">Pure Green Franchise Onboarding Portal</div>
</div>
<script>
async function send() {
  const email = document.getElementById('email').value.trim();
  if (!email) { show('err', 'Please enter your email.'); return; }
  const btn = document.getElementById('btn');
  btn.disabled=true; btn.textContent='Sending';
  hide('err'); hide('suc');
  const res = await fetch('/api/auth/forgot-password', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
  const d = await res.json();
  if (d.success) show('suc', 'If that email is registered, a reset link has been sent. Check your inbox.');
  else show('err', d.error || 'Something went wrong.');
  btn.disabled=false; btn.textContent='Send Reset Link';
}
function show(id, msg) { const e=document.getElementById(id); e.textContent=msg; e.classList.add('show'); }
function hide(id) { document.getElementById(id).classList.remove('show'); }
document.getElementById('email').addEventListener('keydown', e => { if(e.key==='Enter') send(); });
</script>
</body>
</html>
